<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LegalEase - Register</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            ⚖️ LegalEase
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- Register Container -->

    <div class="auth-container">

        <h1>Create Account</h1>

        <p>
            Register to use LegalEase
        </p>


        <form action="/register" method="POST">

            <!-- Name -->

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Register -->

            <button
                type="submit"
                class="generate-btn">

                Create Account

            </button>

        </form>


        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</body>

</html>
